
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171416">
<title>S. 壁 — Author Platform</title>
<style>
:root{--bg:#f3f0eb;--paper:#fffdfa;--ink:#252124;--muted:#817a78;--line:#e5ded7;--wine:#702c3b;--gold:#b89a6a}
:root[data-theme="dark"]{--bg:#171416;--paper:#211b1e;--ink:#f4ece8;--muted:#b8aaa7;--line:#403438;--wine:#9b4659;--gold:#c5a875}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;transition:background .2s,color .2s}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1180px)/2),22px);background:#171416;color:#f6f0eb;position:sticky;top:0;z-index:5}
.logo{font:italic 32px Georgia;letter-spacing:-2px}
.logo small{font:16px Georgia;letter-spacing:0}
.top .actions{display:flex;gap:8px}
.top button{background:transparent;border:1px solid #5d5357;color:#f6f0eb;border-radius:30px;padding:9px 15px}
.wrap{max-width:1180px;margin:auto;padding:28px 22px 80px}
.nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}
.nav button,.secondary{border:1px solid var(--line);background:var(--paper);border-radius:30px;padding:9px 15px;color:var(--muted)}
.nav button.active,.primary{background:var(--wine);color:white;border-color:var(--wine)}
.hero{min-height:310px;border-radius:20px;background:linear-gradient(90deg,#181417f5,#261d20c9 52%,#34272a77),radial-gradient(circle at 82% 32%,#ad8c80,#2c2226 65%);color:#fff;padding:42px;display:flex;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"S. 壁";position:absolute;right:4%;font:italic clamp(70px,15vw,170px) Georgia;color:#fff1}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.hero h1{font:normal clamp(42px,6vw,68px)/1.02 Georgia;margin:13px 0}
.hero p{color:#ddd0cd;max-width:440px}
.primary,.secondary{border:1px solid var(--wine);border-radius:30px;padding:11px 18px}
.secondary{background:transparent;color:var(--wine)}
h1,h2,h3{font-family:Georgia;font-weight:400}
h2{font-size:30px;margin:32px 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.cover{aspect-ratio:3/4;background:linear-gradient(145deg,#a58c84,#35282d 65%,#171416);color:#fff;display:flex;align-items:end;padding:17px;position:relative;background-size:cover;background-position:center}
.cover:after{content:"";position:absolute;inset:12px;border:1px solid #ffffff55;pointer-events:none}
.cover b{font:italic 27px Georgia;z-index:1;text-shadow:0 2px 9px #000}
.info{padding:13px}
.info strong{font:19px Georgia}
.muted{color:var(--muted);font-size:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;color:var(--ink)}
textarea{min-height:130px}
.hidden{display:none!important}
.auth{max-width:440px;margin:30px auto}
.auth h1{font-size:44px}
.workrow{display:flex;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mini{width:62px;height:78px;background:#514147;color:#fff;display:grid;place-items:center;font:italic 23px Georgia;border-radius:7px;overflow:hidden}
.tag{font-size:10px;color:var(--wine);letter-spacing:1px}
.reader{max-width:760px;margin:25px auto;font:20px/1.9 Georgia;white-space:pre-wrap}
.chapter{padding:14px 0;border-bottom:1px solid var(--line)}
.notice{color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#211b1e;color:white;padding:12px 18px;border-radius:30px;z-index:10}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:17px;text-align:center}
.stat b{display:block;font:30px Georgia;color:var(--wine)}
.profile-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.avatar{width:86px;height:86px;border-radius:50%;background:linear-gradient(140deg,#8d5b65,#282025);display:grid;place-items:center;color:white;font:30px Georgia}
@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
.top{padding:0 12px}
.wrap{padding:18px 14px 70px}
.hero{padding:27px;min-height:260px}
.hero:after{right:-5%;font-size:80px}
.stats{grid-template-columns:repeat(2,1fr)}
.top button{padding:8px 10px}
}
#splash{position:fixed;inset:0;background:#171416;color:#f7f0e9;z-index:30;display:grid;place-items:center;transition:opacity .65s,visibility .65s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center}
.splash-mark{font:italic 76px Georgia;letter-spacing:-7px}
.splash-sub{font-size:9px;letter-spacing:5px;color:#b89a6a;margin-top:12px}
.splash-line{height:2px;width:120px;background:#49383d;margin:28px auto 0;overflow:hidden}
.splash-line:after{content:"";display:block;height:100%;width:40%;background:#b89a6a;animation:loadline 1s ease-in-out infinite}
@keyframes loadline{to{transform:translateX(260%)}}
</style>
</head>
<body>

<div id="splash">
<div class="splash-inner">
<div class="splash-mark">S. 壁</div>
<div class="splash-sub">AUTHOR PLATFORM</div>
<div class="splash-line"></div>
</div>
</div>

<header class="top">
<div class="logo">S.<small>壁</small></div>
<div class="actions">
<button id="themeBtn" title="Сменить тему">☼ Тема</button>
<button id="account">Войти</button>
</div>
</header>

<main class="wrap">
<nav class="nav" id="nav"></nav>
<div id="app"></div>
</main>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

const $=s=>document.querySelector(s);
let me=null,works=[],tab="home",current=null;

/* Исправлено: корректное экранирование HTML */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));

function hideSplash(){
const splash=$("#splash");
if(splash){
splash.classList.add("out");
setTimeout(()=>{
splash.style.display="none";
},700);
}
}

/* Аварийная защита заставки */
window.addEventListener("load",()=>setTimeout(hideSplash,1000));
setTimeout(hideSplash,8000);

async function api(url,opts={}){
let r=await fetch(url,{
credentials:"same-origin",
...opts,
headers:opts.body instanceof FormData?{}:{
"Content-Type":"application/json",
...(opts.headers||{})
}
});
let d=await r.json().catch(()=>({}));
if(!r.ok)throw Error(d.error||"Ошибка");
return d;
}

function toast(s){
let e=$("#toast");
e.textContent=s;
e.classList.remove("hidden");
setTimeout(()=>e.classList.add("hidden"),2600);
}

function owner(){
return me?.role==="owner";
}

function setTheme(t){
document.documentElement.dataset.theme=t;
try{
localStorage.setItem("swall-theme",t);
}catch(e){}
$("#themeBtn").textContent=t==="dark"?"☾ Тема":"☼ Тема";
}

$("#themeBtn").onclick=()=>{
setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
};

try{
setTheme(localStorage.getItem("swall-theme")||"light");
}catch(e){
setTheme("light");
}

async function refresh(){
me=(await api("/api/me")).user;
works=(await api("/api/works")).works;
$("#account").textContent=me?"Выйти":"Войти";
render();
}

function nav(){
let a=[["home","Главная"],["catalog","Каталог"],["library","Библиотека"]];
if(me)a.push(["profile","Мой профиль"]);
if(owner())a.push(["studio","Панель автора"]);

$("#nav").innerHTML=a.map(([k,v])=>
`<button data-tab="${k}" class="${tab===k?"active":""}">${v}</button>`
).join("");

document.querySelectorAll("[data-tab]").forEach(b=>{
b.onclick=()=>{
tab=b.dataset.tab;
render();
};
});
}

function cards(a){
return a.map(w=>`
<article class="card" data-work="${w.id}">
<div class="cover" style="${w.cover?`background-image:linear-gradient(0deg,#171416aa,transparent),url('${esc(w.cover)}')`:""}">
<b>${esc(w.title)}</b>
</div>
<div class="info">
<strong>${esc(w.title)}</strong>
<div class="muted">${esc(w.kind)} · ${esc(w.genre)}</div>
<div class="muted">${w.chapter_count??"—"} глав · ${w.views||0} прочтений</div>
</div>
</article>
`).join("");
}

function home(){
return `
<section class="hero">
<div style="position:relative;z-index:1">
<div class="eyebrow">WRITE · READ · INSPIRE</div>
<h1>Истории,<br>которые остаются.</h1>
<p>Авторская платформа S. 壁 — место для миров, созданных словами.</p>
<button class="primary" onclick="tab='catalog';render()">Открыть каталог →</button>
</div>
</section>
<h2>Истории S. 壁</h2>
<div class="grid">${cards(works)}</div>
`;
}

function catalog(){
return `
<div class="row between">
<div>
<div class="eyebrow">DISCOVER STORIES</div>
<h1>Каталог</h1>
</div>
<input id="search" placeholder="Поиск…" style="max-width:260px;padding:12px;border:1px solid var(--line);border-radius:30px;background:var(--paper);color:var(--ink)">
</div>
<div class="grid" id="cards">${cards(works)}</div>
`;
}

async function library(){
if(!me)return `
<div class="panel">
<h1>Библиотека</h1>
<p>Войдите, чтобы сохранять любимые истории.</p>
<button class="primary" onclick="showAuth()">Войти</button>
</div>
`;
let d=await api("/api/library");
return `
<h1>Библиотека</h1>
<p class="muted">Сохранённые истории.</p>
<div class="grid">${cards(d.works)}</div>
`;
}

function studio(){
if(!owner())return "<div class=panel>Доступ только владельцу.</div>";

return `
<div class="eyebrow">OWNER ACCESS</div>
<h1>Панель автора</h1>
<p class="muted">Управление произведениями и обложками.</p>

<div class="panel">
<h2 style="margin-top:0">Новое произведение</h2>
<form id="newWork">
<div class="field">
<label>Название</label>
<input name="title" required>
</div>
<div class="field">
<label>Формат</label>
<select name="kind">
<option>Новелла</option>
<option>Манхва</option>
<option>Рассказ</option>
<option>Сборник</option>
</select>
</div>
<div class="field">
<label>Жанр</label>
<input name="genre">
</div>
<div class="field">
<label>Описание</label>
<textarea name="description"></textarea>
</div>
<button class="primary">Опубликовать</button>
</form>
</div>

<h2>Мои произведения</h2>

${works.map(w=>`
<div class="workrow">
<div class="mini">
${w.cover?`<img src="${esc(w.cover)}" style="width:100%;height:100%;object-fit:cover">`:"S."}
</div>
<div style="flex:1;min-width:130px">
<b>${esc(w.title)}</b>
<div class="muted">${w.chapter_count} глав · ${w.views||0} прочтений</div>
</div>
<button class="secondary" data-cover="${w.id}">Обложка</button>
<button class="secondary" data-edit="${w.id}">Изменить</button>
<button class="secondary" data-chapters="${w.id}">Главы</button>
<button class="secondary" data-delete="${w.id}">Удалить</button>
</div>
`).join("")}
`;
}

function auth(){
return `
<div class="auth">
<div class="eyebrow">WELCOME TO S. 壁</div>
<h1 id="authTitle">Добро пожаловать</h1>
<p class="muted">Войди в свой аккаунт автора или читателя.</p>

<form id="authForm" class="panel">
<div class="field">
<label>Логин</label>
<input name="login" required autocomplete="username">
</div>
<div class="field">
<label>Пароль</label>
<input name="password" type="password" required minlength="8" autocomplete="current-password">
</div>
<button class="primary" id="authSubmit">Войти</button>
</form>

<button class="secondary" id="switch">Создать читательский аккаунт</button>
<p class="notice">Пароли хранятся на сервере в виде криптографических хешей.</p>
</div>
`;
}

async function profile(login){
let d=await api("/api/profile/"+encodeURIComponent(login));

$("#nav").classList.remove("hidden");

$("#app").innerHTML=`
<div class="eyebrow">AUTHOR PROFILE</div>

<section class="panel">
<div class="profile-head">
<div class="avatar">${esc(d.profile.login.slice(0,1).toUpperCase())}</div>
<div>
<h1 style="margin:0">${esc(d.profile.login)}</h1>
<div class="muted">${d.profile.role==="owner"?"Владелец платформы":"Автор S. 壁"}</div>
<p>${esc(d.profile.bio||"Истории, которые остаются.")}</p>
</div>

${me&&me.login!==d.profile.login?`
<button class="primary" id="followBtn">${d.is_following?"Отписаться":"Подписаться"}</button>
`:""}
</div>

<div class="stats">
<div class="stat"><b id="followers">${d.followers}</b>Подписчики</div>
<div class="stat"><b>${d.reads}</b>Читатели</div>
<div class="stat"><b>${d.works_count}</b>Работы</div>
<div class="stat"><b>${d.following}</b>Подписки</div>
</div>
</section>

${me&&me.login===d.profile.login?`
<section class="panel">
<h3>О себе</h3>
<form id="bioForm">
<div class="field">
<textarea name="bio" maxlength="500" placeholder="Расскажи о себе…">${esc(d.profile.bio||"")}</textarea>
</div>
<button class="primary">Сохранить профиль</button>
</form>
</section>
`:""}

<h2>Публикации</h2>
<div class="grid">${cards(d.works)}</div>
`;

$("#followBtn")?.addEventListener("click",async()=>{
try{
let x=await api("/api/follow/"+encodeURIComponent(login),{method:"POST"});
$("#followBtn").textContent=x.following?"Отписаться":"Подписаться";
$("#followers").textContent=x.followers;
}catch(e){
toast(e.message);
}
});

$("#bioForm")?.addEventListener("submit",async e=>{
e.preventDefault();
await api("/api/profile",{
method:"POST",
body:JSON.stringify({bio:new FormData(e.target).get("bio")})
});
toast("Профиль сохранён");
});

bindCards();
}

async function detail(id){
let d=await api("/api/works/"+id);
current=d.work;
$("#nav").classList.add("hidden");

$("#app").innerHTML=`
<button class="secondary" id="back">← Назад</button>

<div class="row" style="align-items:flex-start;margin:25px 0">
<div class="mini" style="width:145px;height:190px">
${current.cover?`<img src="${esc(current.cover)}" style="width:100%;height:100%;object-fit:cover">`:"S."}
</div>

<div>
<div class="tag">${esc(current.kind)} · ${esc(current.genre)}</div>
<h1>${esc(current.title)}</h1>
<p>${esc(current.description)}</p>
<div class="muted">Автор · ${esc(current.author||"S. 壁")} · ${current.views||0} прочтений</div>
${me?`<button class="secondary" id="favBtn">♡ В библиотеку</button>`:""}
</div>
</div>

<h2>Главы</h2>

${d.chapters.length?d.chapters.map(c=>`
<div class="chapter">
<b>${esc(c.title)}</b>
<article class="reader">${esc(c.body)}</article>
${owner()?`<button class="secondary" data-delchapter="${c.id}">Удалить главу</button>`:""}
</div>
`).join(""):"<p class=muted>Главы скоро появятся.</p>"}

${owner()?`
<div class="panel">
<h3>Добавить главу</h3>
<form id="chapterForm">
<div class="field">
<label>Название</label>
<input name="title" required>
</div>
<div class="field">
<label>Текст</label>
<textarea name="body" required></textarea>
</div>
<button class="primary">Сохранить главу</button>
</form>
</div>
`:""}

${me?`
<form id="commentForm" class="panel">
<textarea name="body" placeholder="Комментарий…" required></textarea>
<button class="primary">Отправить</button>
</form>
`:""}

${d.comments.map(c=>`
<div class="panel">
<b>${esc(c.author)}</b>
<p>${esc(c.body)}</p>
</div>
`).join("")}
`;

$("#back").onclick=()=>{
tab="catalog";
$("#nav").classList.remove("hidden");
render();
};

$("#favBtn")?.addEventListener("click",async()=>{
try{
let x=await api("/api/favorites/"+id,{method:"POST"});
toast(x.saved?"Добавлено в библиотеку":"Удалено из библиотеки");
}catch(e){
toast(e.message);
}
});

let f=$("#chapterForm");
if(f)f.onsubmit=async e=>{
e.preventDefault();
await api(`/api/works/${id}/chapters`,{
method:"POST",
body:JSON.stringify(Object.fromEntries(new FormData(f)))
});
toast("Глава опубликована");
detail(id);
};

let c=$("#commentForm");
if(c)c.onsubmit=async e=>{
e.preventDefault();
await api(`/api/works/${id}/comments`,{
method:"POST",
body:JSON.stringify(Object.fromEntries(new FormData(c)))
});
toast("Комментарий добавлен");
detail(id);
};

document.querySelectorAll("[data-delchapter]").forEach(b=>{
b.onclick=async()=>{
await api("/api/chapters/"+b.dataset.delchapter,{method:"DELETE"});
detail(id);
};
});
}

function bindCards(){
document.querySelectorAll("[data-work]").forEach(b=>{
b.onclick=()=>detail(b.dataset.work);
});
}

function bind(){
bindCards();

let s=$("#search");
if(s)s.oninput=()=>{
$("#cards").innerHTML=cards(
works.filter(w=>(w.title+" "+w.genre).toLowerCase().includes(s.value.toLowerCase()))
);
bindCards();
};

let f=$("#newWork");
if(f)f.onsubmit=async e=>{
e.preventDefault();
try{
await api("/api/works",{
method:"POST",
body:JSON.stringify(Object.fromEntries(new FormData(f)))
});
works=(await api("/api/works")).works;
render();
toast("Опубликовано");
}catch(x){
toast(x.message);
}
};

document.querySelectorAll("[data-delete]").forEach(b=>{
b.onclick=async()=>{
if(confirm("Удалить произведение и все его главы?")){
try{
await api("/api/works/"+b.dataset.delete,{method:"DELETE"});
works=(await api("/api/works")).works;
render();
toast("Удалено");
}catch(e){
toast(e.message);
}
}
};
});

document.querySelectorAll("[data-edit]").forEach(b=>{
b.onclick=async()=>{
let w=works.find(x=>x.id==b.dataset.edit);
let title=prompt("Название",w.title);
if(title===null)return;
let genre=prompt("Жанр",w.genre)||"";
let description=prompt("Описание",w.description)||"";

try{
await api("/api/works/"+w.id,{
method:"PUT",
body:JSON.stringify({...w,title,genre,description})
});
works=(await api("/api/works")).works;
render();
toast("Сохранено");
}catch(e){
toast(e.message);
}
};
});

document.querySelectorAll("[data-cover]").forEach(b=>{
b.onclick=()=>{
let input=document.createElement("input");
input.type="file";
input.accept="image/png,image/jpeg,image/webp,image/gif";

input.onchange=async()=>{
if(!input.files[0])return;
let fd=new FormData();
fd.append("cover",input.files[0]);

try{
await api("/api/works/"+b.dataset.cover+"/cover",{
method:"POST",
body:fd
});
works=(await api("/api/works")).works;
render();
toast("Обложка загружена");
}catch(e){
toast(e.message);
}
};

input.click();
};
});

document.querySelectorAll("[data-chapters]").forEach(b=>{
b.onclick=()=>detail(b.dataset.chapters);
});
}

async function render(){
nav();

let views={home,catalog,library,studio};

if(tab==="profile"&&me){
await profile(me.login);
return;
}

let content=views[tab]||home;
$("#app").innerHTML=tab==="library"?await library():content();
bind();
}

function showAuth(){
tab="auth";
$("#nav").classList.add("hidden");
$("#app").innerHTML=auth();

let reg=false;

$("#switch").onclick=()=>{
reg=!reg;
$("#authTitle").textContent=reg?"Создать аккаунт":"Добро пожаловать";
$("#authSubmit").textContent=reg?"Зарегистрироваться":"Войти";
$("#switch").textContent=reg?"Уже зарегистрированы? Войти":"Создать читательский аккаунт";
};

$("#authForm").onsubmit=async e=>{
e.preventDefault();

try{
let d=await api(reg?"/api/register":"/api/login",{
method:"POST",
body:JSON.stringify(Object.fromEntries(new FormData(e.target)))
});

me=d.user;
$("#account").textContent="Выйти";
